{# One icon family: 24px grid, 1.75 stroke, round caps. Decorative unless labelled. #}
{% macro icon(name, size=20) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == "camera" -%}
<path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.6-2.2A1.5 1.5 0 0 1 10.3 4h3.4a1.5 1.5 0 0 1 1.2.8L16.5 7h2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.25"/>
{%- elif name == "arrow" -%}
<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>
{%- elif name == "gift" -%}
<rect x="4" y="9" width="16" height="11" rx="1.5"/><path d="M3 9h18"/><path d="M12 9v11"/><path d="M12 9c-1.5-3-5-3.5-5-1.25S10 9 12 9zm0 0c1.5-3 5-3.5 5-1.25S14 9 12 9z"/>
{%- elif name == "mic" -%}
<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/><path d="M8.5 21h7"/>
{%- elif name == "pin" -%}
<path d="M12 21s-6.5-6.1-6.5-11a6.5 6.5 0 0 1 13 0c0 4.9-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.25"/>
{%- elif name == "alert" -%}
<path d="M12 4 2.8 19.5a.7.7 0 0 0 .6 1h17.2a.7.7 0 0 0 .6-1z"/><path d="M12 10v4.5"/><path d="M12 17.6v.1"/>
{%- elif name == "menu" -%}
<path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/>
{%- elif name == "close" -%}
<path d="M6 6l12 12"/><path d="M18 6 6 18"/>
{%- elif name == "check" -%}
<path d="M5 12.5l4.5 4.5L19 7.5"/>
{%- elif name == "cert-clear" -%}
<circle cx="12" cy="12" r="7.5" fill="currentColor"/>
{%- elif name == "cert-likely" -%}
<circle cx="12" cy="12" r="7.5"/><path d="M12 4.5a7.5 7.5 0 0 1 0 15z" fill="currentColor"/>
{%- elif name == "cert-unsure" -%}
<circle cx="12" cy="12" r="7.5"/>
{%- elif name == "clock" -%}
<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
{%- endif -%}
</svg>
{%- endmacro %}

{% macro mark(size=32) -%}
<svg class="mark" width="{{ size }}" height="{{ size }}" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
  <rect width="32" height="32" rx="8" fill="var(--wet)"/>
  <circle cx="16" cy="16" r="8.5" fill="none" stroke="#fff" stroke-width="4.5" stroke-dasharray="22.7 4" transform="rotate(-62 16 16)"/>
</svg>
{%- endmacro %}
